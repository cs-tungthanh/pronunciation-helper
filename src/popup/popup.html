<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sayly</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="brand">
    <img class="brand-mark" src="icons/icon48.png" alt="" width="32" height="32">
    <p class="brand-name">Sayly <span class="brand-ipa" lang="und-fonipa">/ˈseɪ.li/</span></p>
    <button type="button" id="openSettings" class="icon-button"></button>
  </header>

  <section class="site" aria-label="This site">
    <div class="site-text">
      <p class="site-name" id="siteName">Loading…</p>
      <p class="site-status" id="toggleStatus"></p>
    </div>
    <label class="switch">
      <input type="checkbox" id="enableToggle" role="switch" aria-labelledby="siteName" disabled>
      <span class="switch-track" aria-hidden="true"></span>
    </label>
  </section>

  <fieldset class="setting">
    <legend class="setting-title" id="modeLegend">When you select text</legend>
    <div class="segments" id="popupModes"></div>
    <p class="setting-hint" id="popupModeHint" aria-live="polite"></p>
    <div class="subsetting" id="copyButtonRow" hidden>
      <label for="showCopyButton">Copy buttons</label>
      <span class="switch">
        <input type="checkbox" id="showCopyButton" role="switch">
        <span class="switch-track" aria-hidden="true"></span>
      </span>
    </div>
  </fieldset>

  <label class="setting setting-row">
    <span class="setting-title">Voice speed</span>
    <select id="speechSpeed" class="select"></select>
  </label>

  <label class="setting setting-row">
    <span class="setting-title">Translate into</span>
    <select id="targetLanguage" class="select"></select>
  </label>

  <label class="setting setting-row">
    <span class="setting-title">Open words in</span>
    <select id="dictionarySite" class="select"></select>
  </label>

  <div class="setting setting-row">
    <span class="setting-title" id="themeLabel">Theme</span>
    <div class="theme-switch" id="themeSwitch" role="radiogroup" aria-labelledby="themeLabel"></div>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
